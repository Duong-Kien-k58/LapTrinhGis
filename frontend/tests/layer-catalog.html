<!doctype html>
<html lang="vi"><meta charset="utf-8"><title>Kiểm tra zoom tới lớp</title><body><div class="map-wrapper"></div><pre id="results">Đang kiểm tra…</pre>
<script type="module">
import Collection from 'ol/Collection.js';
import View from 'ol/View.js';
import Group from 'ol/layer/Group.js';
import TileLayer from 'ol/layer/Tile.js';
import TileWMS from 'ol/source/TileWMS.js';
import { transformExtent } from 'ol/proj.js';
import { createLayerCatalogTool } from '../src/tool/layerCatalogTool.js';
const assert = (ok, message) => { if (!ok) throw new Error(message); };
const tick = () => new Promise(resolve => setTimeout(resolve, 20));
const make = (id, properties = {}) => {
  const layer = new TileLayer({ visible: false, source: new TileWMS({ url: '/mock-wms', params: { LAYERS: id } }) });
  layer.setProperties({ configId: id, title: id, ...properties });
  return layer;
};
const known = make('known', { rasterMetadata: { bbox: [105, 20, 106, 21], crs: 'EPSG:4326' } });
const unknown = make('unknown', { rasterMetadata: { bbox: [500000, 1400000, 501000, 1401000], crs: 'EPSG:5898' } });
const vector = make('vector', { layerKind: 'wms' });
const missing = make('missing');
const base = make('base', { layerKind: 'base' });
const otherBase = make('otherBase', { layerKind: 'base' });
otherBase.setVisible(true);
const rasters = new Group({ layers: [known, unknown, missing], visible: false });
rasters.setProperties({ tocGroupId: 'raster', title: 'Raster' });
const vectors = new Group({ layers: [vector] });
vectors.setProperties({ tocGroupId: 'vector', title: 'Vector' });
const bases = new Group({ layers: [base, otherBase] });
bases.setProperties({ tocGroupId: 'base', title: 'Nền' });
const view = new View({ center: [0, 0], zoom: 2 });
let fitted;
view.fit = (extent, options) => { fitted = { extent, options }; };
const rootLayers = new Collection([bases, rasters, vectors]);
const map = { getView: () => view, getLayers: () => rootLayers, getSize: () => [1200, 800] };
let requests = 0;
const realFetch = window.fetch;
window.fetch = async () => {
  requests++;
  return new Response(`<WMS_Capabilities version="1.3.0" xmlns="http://www.opengis.net/wms"><Capability><Layer><Title>Test</Title>${['unknown', 'vector'].map(name => `<Layer><Name>${name}</Name><Title>${name}</Title><EX_GeographicBoundingBox><westBoundLongitude>108</westBoundLongitude><eastBoundLongitude>109</eastBoundLongitude><southBoundLatitude>12</southBoundLatitude><northBoundLatitude>13</northBoundLatitude></EX_GeographicBoundingBox></Layer>`).join('')}</Layer></Capability></WMS_Capabilities>`, { status: 200 });
};
const click = async id => { document.querySelector(`[data-layer-id="${id}"] .toc-zoom-layer`).click(); await tick(); };
try {
  localStorage.removeItem('webgis_layer_catalog_v1');
  const config = { id: 'vector', group: 'vector' };
  const catalog = createLayerCatalogTool({ map, baseGroup: bases, thematicGroups: [vectors], rasterGroup: rasters, layerConfigs: [config], rasterLayerMap: {} });
  assert(document.querySelectorAll('.toc-zoom-layer').length === 6, 'Mỗi lớp có một nút mắt');
  await click('known');
  assert(known.getVisible() && rasters.getVisible(), 'Bật lớp và nhóm khi zoom');
  assert(JSON.stringify(fitted.extent) === JSON.stringify(transformExtent([105,20,106,21], 'EPSG:4326', view.getProjection(), 8)), 'Zoom đúng phạm vi metadata');
  assert(requests === 0, 'Metadata đã đủ thì không gọi GeoServer');
  await click('unknown');
  assert(JSON.stringify(fitted.extent) === JSON.stringify(transformExtent([108,12,109,13], 'EPSG:4326', view.getProjection(), 8)), 'CRS chưa đăng ký dùng phạm vi WMS');
  await click('vector');
  assert(vector.getVisible() && requests === 1, 'Vector dùng cùng danh mục WMS đã tải');
  const previous = fitted;
  await click('missing');
  assert(fitted === previous && !document.querySelector('.toc-zoom-status').hidden, 'Lớp thiếu phạm vi báo lỗi và không đổi khung nhìn');
  await click('base');
  assert(base.getVisible() && !otherBase.getVisible(), 'Zoom basemap chọn đúng một nền');
  const transfer = new DataTransfer();
  document.querySelector('[data-layer-id="vector"]').dispatchEvent(new DragEvent('dragstart', { bubbles: true, dataTransfer: transfer }));
  document.querySelector('[data-group-id="raster"] .toc-group-children').dispatchEvent(new DragEvent('drop', { bubbles: true, dataTransfer: transfer }));
  assert(rasters.getLayers().getArray().includes(vector) && config.group === 'raster', 'Chuyển lớp sang nhóm khác');
  const checkbox = document.querySelector('[data-layer-id="vector"] input');
  checkbox.click();
  assert(!vector.getVisible(), 'Checkbox cập nhật trạng thái lớp');
  document.querySelector('.layer-catalog-save').click();
  rasters.getLayers().remove(vector); vectors.getLayers().push(vector); vector.setVisible(true);
  catalog.restoreVisibility();
  assert(rasters.getLayers().getArray().includes(vector) && !vector.getVisible(), 'Khôi phục membership và visibility đã lưu');
  const dynamic = make('dynamic', { rasterName: 'dynamic', layerKind: 'raster' });
  rasters.getLayers().push(dynamic);
  rasters.getLayers().remove(unknown);
  document.querySelector('.layer-catalog-reset').click();
  assert(vectors.getLayers().getArray().includes(vector) && config.group === 'vector', 'Reset khôi phục nhóm mặc định');
  assert(rasters.getLayers().getArray().includes(dynamic) && !rasters.getLayers().getArray().includes(unknown), 'Reset giữ raster động, không hồi sinh lớp đã xóa');
  assert(!vector.getVisible() && !rasters.getVisible(), 'Reset khôi phục visibility mặc định');
  document.querySelector('#results').textContent = 'PASS: nút mắt, bật lớp/nhóm, phạm vi metadata, CRS 5898 qua WMS, vector, cache, lỗi thiếu phạm vi và basemap.';
  document.body.dataset.result = 'pass';
} catch (error) { document.body.dataset.result = 'fail'; document.querySelector('#results').textContent = error.stack; }
finally { window.fetch = realFetch; }
</script></body></html>
